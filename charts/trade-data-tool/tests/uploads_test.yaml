suite: upload rules (the web images bake no FileService section, so AllowedExt has no fallback)
templates:
  - secrets.yaml
release:
  name: mytdt
  namespace: user-sean
tests:
  # AppSettings.AllowedExt() returns null when the key is absent, and every
  # caller does .Split(',') on it unguarded -> NullReferenceException as soon as
  # the user picks a file.
  - it: AllowedExt is present so the upload pages cannot NRE
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: '"AllowedExt": "tsv,txt,csv"'
  # App 3.x reads the import file types and size caps from System Configuration
  # rows; the matching appsettings keys have no reader, so they're not rendered.
  - it: renders no settings that app 3.x never reads
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - notMatchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: 'ImportFileAllowedExt|MaxFileSize'
  - it: the upload file types are configurable
    set:
      uploads:
        allowedExtensions: "csv"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: '"AllowedExt": "csv"'
