suite: object storage modes (bundled MinIO vs platform S3)
templates:
  - minio.yaml
  - secrets.yaml
  - deployments.yaml
release:
  name: mytdt
  namespace: user-sean
tests:
  - it: minio mode (default) deploys MinIO with a PVC
    templates: [minio.yaml]
    asserts:
      - hasDocuments:
          count: 3
  - it: the default (every Onyxia launch) stores files in this release's MinIO
    templates: [secrets.yaml]
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: '"ObjectStorage": \{\s*"Provider": "minio"\s*\}'
  - it: s3 without credentials (e.g. an old saved Onyxia configuration) is refused as unsupported here
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
    asserts:
      - failedTemplate:
          errorPattern: "S3 storage isn't supported on the UN Global Platform: launch with the default file storage \\(MinIO\\)\\..*Nothing has been changed\\."
  - it: minio mode lets FileService create its buckets (a fresh MinIO is empty)
    templates: [secrets.yaml]
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: '"MinioConfig": \{[^}]*"AutoCreateBuckets": true'
  - it: s3 mode leaves bucket creation alone (buckets are prefixes of one shared bucket)
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/user-sean/"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - notMatchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: AutoCreateBuckets
  - it: s3 mode keeps files in a folder named after the release, inside the working directory
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/user-sean/"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"user-sean/mytdt\""
  - it: an Onyxia launch lands in <project folder>/trade-data-tool-<n>, the number in its web address
    templates: [secrets.yaml]
    release:
      name: trade-data-tool-546840
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/user-r2levukldq/"
    documentSelector:
      path: metadata.name
      value: trade-data-tool-546840-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"user-r2levukldq/trade-data-tool-546840\""
  - it: a working directory without the trailing slash gives the same folder
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/user-sean"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"user-sean/mytdt\""
  - it: leading or doubled slashes give the same folder
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "/datalab-142496269814-user-bucket//user-sean//"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"user-sean/mytdt\""
  - it: a bucket-only working directory puts the folder at the bucket root
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"mytdt\""
  - it: a bucket-only working directory without a slash does too
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"mytdt\""
  - it: a deeper working directory keeps every level
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/projet-trade/team-a/"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"projet-trade/team-a/mytdt\""
  - it: resume (an upgrade of the same release) keeps the folder
    templates: [secrets.yaml]
    release:
      upgrade: true
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/user-sean/"
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"Bucket\": \"datalab-142496269814-user-bucket\""
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: "\"BasePrefix\": \"user-sean/mytdt\""
  - it: s3 mode without a working directory fails with a clear message
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "/"
    asserts:
      - failedTemplate:
          errorPattern: "S3 storage needs a working directory: set objectStorage\\.s3\\.workingDirectoryPath to your S3 folder.*Nothing has been changed\\."
  - it: s3 mode deploys no MinIO
    templates: [minio.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/user-sean/"
    asserts:
      - hasDocuments:
          count: 0
  - it: s3 mode injects AWS credentials only into fileservice
    templates: [deployments.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
          accessKeyId: AK
          secretAccessKey: SK
          workingDirectoryPath: "datalab-142496269814-user-bucket/user-sean/"
    documentSelector:
      # the Service shares the Deployment's name — select on a pod-spec path
      path: spec.template.spec.containers[0].name
      value: fileservice
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: mytdt-trade-data-tool-s3
  - it: s3 mode without credentials fails loudly at render time
    templates: [secrets.yaml]
    set:
      objectStorage:
        provider: s3
        s3:
          region: us-west-2
    asserts:
      - failedTemplate: {}
  - it: suspend scales every deployment to zero
    templates: [deployments.yaml]
    set:
      global:
        suspend: true
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - equal:
          path: spec.replicas
          value: 0
