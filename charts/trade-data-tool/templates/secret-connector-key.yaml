{{- /*
Connector:EncryptionKey (AES-256-GCM): base64 of 32 random bytes, generated
once per release and reused on every later render via lookup. CoreService
encrypts connector credentials with it and RuleService decrypts the
rule-engine password with it (admin-seed-job.yaml writes that row), so rows
already in the database are unreadable under any other key. There is
deliberately no values field: the key can never be set to "" or swapped by a
values change.

Rotation guard: on an upgrade where this Secret is gone but the release is
otherwise live (its appsettings Secret exists), refuse to render rather than
mint a new key. When lookup sees nothing at all (helm template, client-side
dry-run) a throwaway key is rendered.

A 0.6.x release also has no key Secret and a live appsettings Secret, so the
upgrade guard runs first: helm stops at the first template that fails, and a
0.6.x upgrade must get the "can't upgrade a 2.x database" answer, not advice
to restore a key that never existed.
*/}}
{{- include "tdt.upgradeGuard" . }}
{{- $name := include "tdt.connectorKeySecretName" . }}
{{- $key := index ((lookup "v1" "Secret" .Release.Namespace $name).data | default dict) "key" | default "" }}
{{- if and (not $key) .Release.IsUpgrade (lookup "v1" "Secret" .Release.Namespace (printf "%s-appsettings" (include "tdt.fullname" .))) }}
{{- fail (printf "Secret %s is missing from this live release. Refusing to generate a new Connector:EncryptionKey: connector credentials and the rule-engine password in the database were encrypted with the old key. Restore the Secret; if the key is lost, recreate it with a new key (data key \"key\", base64 of 32 random bytes) and re-enter every connector's credentials." $name) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
  {{- if .Values.database.lifecycle.retainOnDelete }}
  annotations:
    # A retained database's encrypted rows are only readable with this key.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  key: {{ $key | default (randBytes 32 | b64enc) }}
