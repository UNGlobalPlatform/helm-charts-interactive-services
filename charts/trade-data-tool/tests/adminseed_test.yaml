suite: admin login seeding (Onyxia project password)
templates:
  - admin-seed-job.yaml
  - secrets.yaml
release:
  name: mytdt
  namespace: user-sean
tests:
  - it: renders an admin-seed job that targets the configured admin user
    templates: [admin-seed-job.yaml]
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ADMIN_USER")].value
          value: SAdmin
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_DEACTIVATE")].value
          value: DAdmin
  - it: pulls the admin password from the admin secret, never inlines it
    templates: [admin-seed-job.yaml]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ADMIN_PASSWORD")].valueFrom.secretKeyRef.name
          value: mytdt-trade-data-tool-admin
  - it: the admin secret carries the password
    templates: [secrets.yaml]
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-admin
    set:
      security:
        admin:
          password: hunter2
    asserts:
      - equal:
          path: stringData.password
          value: hunter2
  - it: disabling seed keeps the job for the rule-engine rows but drops the admin login
    templates: [admin-seed-job.yaml]
    set:
      security:
        admin:
          seed: false
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ADMIN_PASSWORD")]
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ZEPPELIN_PASSWORD")]
  - it: disabling seed with no Zeppelin anywhere renders no job
    templates: [admin-seed-job.yaml]
    set:
      security:
        admin:
          seed: false
      zeppelin:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: writes the bundled Zeppelin login into the rule-engine rows
    templates: [admin-seed-job.yaml]
    set:
      zeppelin:
        ingress:
          hostname: user-sean-tdt-zeppelin-abc.dev.officialstatistics.org
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ZEPPELIN_USER")].value
          value: onyxia
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ZEPPELIN_PASSWORD")].valueFrom.secretKeyRef
          value: { name: mytdt-trade-data-tool-zeppelin, key: password }
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ZEPPELIN_GROUP")].value
          value: jdbc
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ZEPPELIN_EXTERNAL_URL")].value
          value: https://user-sean-tdt-zeppelin-abc.dev.officialstatistics.org/
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_CONNECTOR_KEY")].valueFrom.secretKeyRef
          value: { name: mytdt-trade-data-tool-connector-key, key: key }
  - it: an unexposed Zeppelin leaves ZeppelinExternalURL alone
    templates: [admin-seed-job.yaml]
    set:
      zeppelin:
        ingress:
          hostname: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TDT_ZEPPELIN_EXTERNAL_URL")].value
          value: ""
  - it: encrypts the password in the token layout RuleService decrypts
    templates: [admin-seed-job.yaml]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'nonce \+ sealed\[-16:\] \+ sealed\[:-16\]'
  - it: writes nothing until the schema bootstrap reports Complete
    templates: [admin-seed-job.yaml]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'row\[0\] == "Complete"'
  - it: seed on adds the admin secret (db + zeppelin + admin + appsettings + minio = 5)
    templates: [secrets.yaml]
    asserts:
      - hasDocuments:
          count: 5
  - it: disabling seed drops the admin secret (db + zeppelin + appsettings + minio = 4)
    templates: [secrets.yaml]
    set:
      security:
        admin:
          seed: false
    asserts:
      - hasDocuments:
          count: 4
  - it: the seed container declares cpu and memory limits (namespace ResourceQuota)
    templates: [admin-seed-job.yaml]
    asserts:
      - exists:
          path: spec.template.spec.containers[0].resources.limits.cpu
      - exists:
          path: spec.template.spec.containers[0].resources.limits.memory
