suite: per-release Connector:EncryptionKey (generated once, never rotated)
templates:
  - secret-connector-key.yaml
  - deployments.yaml
  - secrets.yaml
release:
  name: mytdt
  namespace: user-sean
tests:
  - it: a fresh install generates a base64 key of exactly 32 bytes
    templates: [secret-connector-key.yaml]
    asserts:
      - equal:
          path: metadata.name
          value: mytdt-trade-data-tool-connector-key
      - matchRegex:
          path: data.key
          pattern: '^[A-Za-z0-9+/]{43}=$'
          decodeBase64: true
      - notExists:
          path: metadata.annotations
  - it: an existing key is reused byte-for-byte
    templates: [secret-connector-key.yaml]
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: "v1", resource: "secrets" }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: mytdt-trade-data-tool-connector-key, namespace: user-sean }
          data: { key: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQT0= }
    asserts:
      - equal:
          path: data.key
          value: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQT0=
  - it: refuses to mint a new key for a live release whose key Secret is gone
    templates: [secret-connector-key.yaml]
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: "v1", resource: "secrets" }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: mytdt-trade-data-tool-appsettings, namespace: user-sean }
          data: { appsettings.Production.json: e30= }
    asserts:
      - failedTemplate:
          errorPattern: "mytdt-trade-data-tool-connector-key is missing from this live release. Refusing to generate a new Connector:EncryptionKey"
  - it: an upgrade render with no cluster view (dry-run) fails open
    templates: [secret-connector-key.yaml]
    release:
      upgrade: true
    asserts:
      - matchRegex:
          path: data.key
          pattern: '^[A-Za-z0-9+/]{43}=$'
          decodeBase64: true
  - it: a retained database keeps its key
    templates: [secret-connector-key.yaml]
    set:
      database:
        lifecycle:
          retainOnDelete: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
  - it: CoreService reads the key from the Secret
    templates: [deployments.yaml]
    documentSelector:
      path: spec.template.metadata.labels["app.kubernetes.io/component"]
      value: coreservice
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="Connector__EncryptionKey")].valueFrom.secretKeyRef
          value: { name: mytdt-trade-data-tool-connector-key, key: key }
  - it: RuleService reads the key from the Secret
    templates: [deployments.yaml]
    documentSelector:
      path: spec.template.metadata.labels["app.kubernetes.io/component"]
      value: ruleengineservice
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="Connector__EncryptionKey")].valueFrom.secretKeyRef.name
          value: mytdt-trade-data-tool-connector-key
  - it: no other service gets the key
    templates: [deployments.yaml]
    documentSelector:
      path: spec.template.metadata.labels["app.kubernetes.io/component"]
      value: web
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="Connector__EncryptionKey")]
  - it: the key never lands in the shared appsettings file
    templates: [secrets.yaml]
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - notMatchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: EncryptionKey
