{{/* Password for the database User CR (referenced by passwordSecretKeyRef). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdt.fullname" . }}-db
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
stringData:
  password: {{ .Values.database.auth.password | quote }}
---
{{- $zepResolved := include "tdt.zeppelinResolved" . | fromJson }}
{{- if ne $zepResolved.source "none" }}
{{/* Zeppelin shiro login (consumed by the interpreter push job in external
     mode and by the helm-test smoke pod in every mode). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdt.fullname" . }}-zeppelin
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
stringData:
  password: {{ $zepResolved.password | quote }}
---
{{- end }}
{{- if .Values.security.admin.seed }}
{{/* The TDT application admin login (consumed by the admin-seed job). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdt.fullname" . }}-admin
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
stringData:
  password: {{ .Values.security.admin.password | quote }}
---
{{- end }}
{{/* One appsettings.Production.json shared by every service. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdt.fullname" . }}-appsettings
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
stringData:
  appsettings.Production.json: |-
    {{- include "tdt.appsettings" . | nindent 4 }}
{{- include "tdt.upgradeGuard" . }}{{- /* before any other fail: see secret-connector-key.yaml */}}
{{- if (.Values.objectStorage.minio).rootPassword }}
{{- fail "objectStorage.minio.rootPassword is no longer used: the MinIO root password is generated per release and kept in the <release>-trade-data-tool-minio Secret. Remove the value." }}
{{- end }}
{{- if and (eq .Values.objectStorage.provider "s3") (not .Values.objectStorage.s3.accessKeyId) }}
{{- fail "objectStorage.provider=s3 requires objectStorage.s3.accessKeyId/secretAccessKey (Onyxia injects these)" }}
{{- end }}
{{- if eq .Values.objectStorage.provider "s3" }}
---
{{/* AWS credentials for FileService when using S3 (STS session shape). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdt.fullname" . }}-s3
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.objectStorage.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.objectStorage.s3.secretAccessKey | quote }}
  {{- if .Values.objectStorage.s3.sessionToken }}
  AWS_SESSION_TOKEN: {{ .Values.objectStorage.s3.sessionToken | quote }}
  {{- end }}
{{- end }}
{{- if eq .Values.objectStorage.provider "minio" }}
---
{{- /* MinIO's root credentials. Users never use them (TDT reaches MinIO only
     through FileService, which also signs the browser's presigned URLs), so the
     password is generated per release rather than taken from the project
     password: 40 random characters, reused via lookup so it stays stable across
     upgrades and resumes. A changed password would still be harmless to
     MinIO's own data (no KMS: its config is not encrypted with it). */}}
{{- $minioSecret := printf "%s-minio" (include "tdt.fullname" .) }}
{{- $minioPassword := index ((lookup "v1" "Secret" .Release.Namespace $minioSecret).data | default dict) "MINIO_ROOT_PASSWORD" | default "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $minioSecret }}
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
type: Opaque
data:
  MINIO_ROOT_USER: {{ .Values.objectStorage.minio.rootUser | b64enc }}
  MINIO_ROOT_PASSWORD: {{ $minioPassword | default (randAlphaNum 40 | b64enc) }}
{{- end }}
