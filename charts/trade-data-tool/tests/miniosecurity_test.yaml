suite: bundled MinIO runs non-root (its S3 API is browser-reachable)
templates:
  - minio.yaml
release:
  name: mytdt
  namespace: user-sean
tests:
  - it: the pod runs as uid/gid 1000 with fsGroup on the data volume
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
  - it: the container drops every capability and cannot escalate
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
  - it: HOME and the only writable non-data path are /tmp (MinIO's certs dir lives under $HOME)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="HOME")].value
          value: /tmp
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      - equal:
          path: spec.template.spec.volumes[?(@.name=="tmp")].emptyDir
          value: {}
  - it: probes are httpGet only (the distroless image has no shell for exec probes)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: { path: /minio/health/ready, port: s3 }
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value: { path: /minio/health/live, port: s3 }
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.exec
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.exec
  - it: with no override, MinIO is this release's source build at the app tag
    set:
      objectStorage:
        minio:
          image: ""
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 142496269814.dkr.ecr.us-west-2.amazonaws.com/tdt/minio:v3.1.7
  - it: an explicit image reference still overrides it
    set:
      objectStorage:
        minio:
          image: example.org/minio:custom
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.org/minio:custom
  - it: MinIO uses the registry pull secret like the app images
    set:
      image:
        pullSecretName: ecr-pull
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: [{ name: ecr-pull }]
