{{- if and .Values.database.schema.bootstrap (not .Values.global.suspend) }}
{{/*
Loads the TDT schema into the tenant database on the shared cluster. The
scripts ship inside the release's own mariadb-service image (same commit as
the app images) under /docker-entrypoint-initdb.d. CREATE DATABASE / USE
lines are stripped — the target database comes from the connection.
Tenant SqlJob CRs are (rightly) blocked by policy, so this is a plain Job.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tdt.fullname" . }}-schema-{{ .Release.Revision }}
  labels:
    {{- include "tdt.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-bootstrap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        # Deliberately NO app.kubernetes.io/instance: Onyxia derives readiness from
        # pods carrying that label (tasks), and a completed Job pod reports
        # ready=false forever — if it sorts first it pins the service to "starting".
        app.kubernetes.io/component: schema-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: schema
          image: "{{ .Values.image.registry }}/{{ .Values.database.schema.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TDT_DB_HOST
              value: {{ include "tdt.dbHost" . | quote }}
            - name: TDT_DB_NAME
              value: {{ include "tdt.dbName" . | quote }}
            - name: TDT_DB_USER
              value: {{ include "tdt.dbUserName" . | quote }}
            - name: TDT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tdt.fullname" . }}-db
                  key: password
          command: ["bash", "-ec"]
          args:
            - |
              run() { mariadb -h "$TDT_DB_HOST" -P 3306 -u "$TDT_DB_USER" -p"$TDT_DB_PASSWORD" -D "$TDT_DB_NAME" "$@"; }
              echo "waiting for database $TDT_DB_NAME on $TDT_DB_HOST ..."
              until run -e "SELECT 1" >/dev/null 2>&1; do sleep 5; done
              # Nothing below writes to the database until both refusals have been
              # checked and there is something to apply.
              has_ledger=$(run -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='__tdt_schema_applied'")
              applied() { [ "$has_ledger" = "1" ] && [ "$(run -N -e "SELECT COUNT(*) FROM \`__tdt_schema_applied\` WHERE script='${1//\'/}'")" != "0" ]; }
              # Backstop for the render-time upgrade guard (tdt.upgradeGuard): a
              # database loaded by app 2.x (chart <= 0.6.x) has its first script,
              # s1_tdtuser.sql, in the ledger. App 3.0.0 cannot upgrade it.
              if applied s1_tdtuser.sql; then
                echo "This database was created by app 2.x (chart <= 0.6.x). App 3.0.0 cannot upgrade it in place; nothing has been changed. Roll back to the previous chart version, or uninstall and install fresh."
                exit 1
              fi
              shopt -s nullglob
              pending=()
              for f in /docker-entrypoint-initdb.d/*.sql; do
                n=$(basename "$f")
                if applied "$n"; then echo "skip $n (already applied)"; else pending+=("$f"); fi
              done
              if [ ${#pending[@]} -gt 0 ]; then
                # With binary logging on, a tenant (no SUPER) can create functions and
                # triggers only if log_bin_trust_function_creators is on; otherwise the
                # bundle fails partway (ERROR 1419) and a half-loaded database can't be
                # retried. Checked once, before anything is written.
                # (+ 0: the variables are booleans that read as ON/OFF in string context.)
                if [ "$(run -N -e "SELECT @@log_bin + 0 = 1 AND @@log_bin_trust_function_creators + 0 = 0")" = "1" ]; then
                  echo "The database server has binary logging on without log_bin_trust_function_creators. A platform administrator must enable that setting before TDT can install; nothing has been changed."
                  exit 1
                fi
                run -e "CREATE TABLE IF NOT EXISTS \`__tdt_schema_applied\` (script VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)"
                for f in "${pending[@]}"; do
                  n=$(basename "$f")
                  echo "applying $n"
                  # Strip database selection (the connection owns the target db) and
                  # server-global statements (SET GLOBAL needs SUPER — server config
                  # is the platform's concern, not a tenant bootstrap's).
                  sed -E 's/^\s*CREATE DATABASE [^;]*;//; s/^\s*USE [^;]*;//; /^\s*SET GLOBAL /d' "$f" | run
                  run -e "INSERT INTO \`__tdt_schema_applied\` (script) VALUES ('${n//\'/}')"
                done
              fi
              # Schema must actually be usable, not just loaded without error.
              procs=$(run -N -e "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema = DATABASE()")
              echo "routines present: $procs"
              [ "$procs" -ge 100 ] || { echo "schema bootstrap incomplete (routines=$procs)"; exit 1; }
              run -e "SELECT COUNT(*) FROM \`vw_GetUsers\`" >/dev/null
              echo "schema bootstrap complete"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
{{- end }}
