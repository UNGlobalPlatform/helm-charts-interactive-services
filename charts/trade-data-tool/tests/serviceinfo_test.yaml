suite: every service reports the release's app version (ServiceInfo:Version)
templates:
  - secrets.yaml
  - deployments.yaml
release:
  name: mytdt
  namespace: user-sean
tests:
  - it: the shared appsettings carry ServiceInfo.Version = appVersion (images bake a build date)
    templates: [secrets.yaml]
    documentSelector:
      path: metadata.name
      value: mytdt-trade-data-tool-appsettings
    asserts:
      - matchRegex:
          path: stringData["appsettings.Production.json"]
          pattern: '"ServiceInfo": \{\s*"Version": "3\.1\.0"\s*\}'
  - it: all eight app Deployments mount that file, so all eight report it
    templates: [deployments.yaml]
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: appsettings
            mountPath: /app/appsettings.Production.json
            subPath: appsettings.Production.json
            readOnly: true
  - it: deployments.yaml renders exactly the eight app Deployments (+ their Services)
    templates: [deployments.yaml]
    asserts:
      - hasDocuments:
          count: 16
